name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    environment: production
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Connect to the private network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.VPS_TAILSCALE_HOST }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_TAILSCALE_HOST }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "VPS_SSH_PRIVATE_KEY is empty or not available in the production environment." >&2
            exit 1
          fi
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_TAILSCALE_HOST is empty or not available in the production environment." >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

          echo "Checking Tailscale connectivity to VPS_TAILSCALE_HOST..."
          if ! tailscale ip -4 >/dev/null; then
            echo "Tailscale is not authenticated or did not assign an IPv4 address to the GitHub runner." >&2
            tailscale netcheck || true
            exit 1
          fi
          if ! getent ahosts "$VPS_HOST" >/dev/null; then
            echo "Could not resolve VPS_TAILSCALE_HOST=$VPS_HOST from the GitHub runner." >&2
            echo "Use a Tailscale 100.x.y.z IP, the full MagicDNS name, or enable MagicDNS for the tailnet." >&2
            exit 1
          fi
          if ! tailscale ping --timeout=10s --c 5 "$VPS_HOST"; then
            echo "Tailscale could not reach VPS_TAILSCALE_HOST=$VPS_HOST." >&2
            echo "Check that the OAuth client tag is allowed by ACLs to reach the VPS node." >&2
            exit 1
          fi

          echo "Waiting for SSH on VPS_TAILSCALE_HOST..."
          for attempt in {1..12}; do
            if timeout 5 bash -c '</dev/tcp/$1/22' _ "$VPS_HOST"; then
              ssh_ready=1
              break
            fi
            echo "SSH port check attempt $attempt/12 failed; retrying in 5 seconds..."
            sleep 5
          done
          if [ "${ssh_ready:-0}" -ne 1 ]; then
            echo "Timed out waiting for SSH on VPS_TAILSCALE_HOST=$VPS_HOST." >&2
            echo "Check that sshd is listening on port 22 and that Tailscale ACLs allow tag:ci to connect." >&2
            exit 1
          fi

          if ! ssh-keyscan -T 15 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "Could not collect the SSH host key for VPS_TAILSCALE_HOST=$VPS_HOST." >&2
            echo "Check that the Tailscale node name/IP is reachable from the GitHub runner and that sshd is listening on port 22." >&2
            exit 1
          fi

      - name: Deploy exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_TAILSCALE_HOST }}
          VPS_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          if [ -z "$VPS_USER" ]; then
            echo "VPS_SSH_USER is empty or not available in the production environment." >&2
            exit 1
          fi

          ssh -o BatchMode=yes -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" "/opt/inmobiliaria-frontend/scripts/deploy.sh '$TARGET_SHA'"
